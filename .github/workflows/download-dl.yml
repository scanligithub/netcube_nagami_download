name: Download Buildroot DL from GitLab

on:
  workflow_dispatch: # 允许手动触发

jobs:
  download-and-pack:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 从 GitLab 克隆源码 (如果是私有仓库，需要配置 Token，见下文说明)
      - name: Clone Buildroot from GitLab
        run: git clone --depth 1 https://gitlab.com/netcube-systems-austria/buildroot.git buildroot-src

      # 2. 安装编译依赖
      - name: Install Buildroot Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sed make binutils build-essential gcc g++ bash patch \
          gzip bzip2 perl tar cpio unzip rsync file bc findutils wget git

      # 3. 加载配置 (修正了你提到的 etcube 笔误，应为 netcube)
      - name: Configure Buildroot
        working-directory: buildroot-src
        run: make netcube_nagami_basic_carrier_defconfig

      # 4. 下载所有依赖包 (核心步骤)
      - name: Download All Sources
        working-directory: buildroot-src
        run: make source

      # 5. 打包 dl 目录
      - name: Compress DL Directory
        working-directory: buildroot-src
        run: tar -czf ../nagami-dl-pack.tar.gz dl/

      # 6. 上传打包好的文件
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nagami-buildroot-dl
          path: nagami-dl-pack.tar.gz
          retention-days: 5 # 保留 5 天，足够你下载了
